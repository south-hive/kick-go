<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#182722"><title>온라인 로비 · 틈의 오락실</title><link rel="stylesheet" href="lobby.css?v=1.8.2"></head>
<body><main>
<header><a href="index.html">✧ 틈의 오락실</a><span>ONLINE LOUNGE</span></header>
<div class="lobby-heading"><h1>온라인 로비</h1><div class="row"><button id="open-join" aria-haspopup="dialog" aria-controls="join-dialog">코드 입장</button><button id="open-create" class="primary" aria-haspopup="dialog" aria-controls="create-dialog">+ 방 만들기</button></div></div>
<div class="lobby-layout"><aside class="profile" aria-labelledby="profile-title"><h2 id="profile-title">내 프로필</h2><div class="avatar-placeholder" role="img" aria-label="아바타 준비 중"><span></span></div><form id="identity"><label for="nickname">내 이름</label><input id="nickname" maxlength="16" placeholder="익명" autocomplete="nickname"><label for="character">알까기 캐릭터</label><select id="character" aria-describedby="character-hint"><option value="random" selected>랜덤</option></select><small id="character-hint">자동으로 저장됩니다.</small></form></aside><div class="lobby-content">
<p id="status" role="status" aria-live="polite">서버에 연결하고 있습니다.</p>
<section id="browse">
<div class="list-heading"><h2>공개 방</h2><select id="filter" aria-label="방 목록 게임 필터"><option value="all">모든 게임</option><option value="alkkagi">알까기</option><option value="naval">배틀십</option></select></div><p id="directory-status" role="status">방 목록 연결 중…</p><ul id="rooms" class="rooms" aria-label="공개 방 목록"></ul>
</section>
<dialog id="create-dialog" aria-labelledby="create-title"><form id="create-form" class="panel"><div class="dialog-heading"><h2 id="create-title">방 만들기</h2><button type="button" data-close="create-dialog" aria-label="방 만들기 닫기">닫기 ×</button></div><label for="game">게임</label><select id="game"><option value="alkkagi">알까기 · 나무 위의 한 수</option><option value="naval">배틀십 · 깊은 바다의 한 수</option></select><div id="ruleset-field"><label for="ruleset">알까기 규칙</label><select id="ruleset"><option value="modern" selected>모던 · 회전과 특수 규칙</option><option value="classic">클래식 · 기본 타격</option></select><small>모던은 회전 타격·금강불괴·파쇄·궤적 미리보기를 모두 사용합니다. 클래식은 기본 타격으로 겨룹니다.</small></div><label for="title">방 이름</label><input id="title" maxlength="32" placeholder="함께 한 판"><label for="visibility">공개 범위</label><select id="visibility"><option value="public">공개 · 로비 목록에 표시</option><option value="private">비공개 · 초대 링크와 코드로 입장</option></select><p class="dialog-status" role="status"></p><button id="create" class="primary">방 만들기 ↗</button></form></dialog>
<dialog id="join-dialog" aria-labelledby="join-title"><form id="join-form" class="panel"><div class="dialog-heading"><h2 id="join-title">코드로 입장</h2><button type="button" data-close="join-dialog" aria-label="코드 입장 닫기">닫기 ×</button></div><label for="join-game">초대받은 게임</label><select id="join-game"><option value="alkkagi">알까기</option><option value="naval">배틀십</option></select><label for="code">방 코드</label><input id="code" maxlength="12" placeholder="12자리 초대 코드" autocapitalize="characters" autocomplete="off" spellcheck="false"><p class="dialog-status" role="status"></p><div class="row"><button id="join" class="primary">참가하기</button><button id="watch-code" type="button">관전</button></div><small>비공개 방도 초대받은 코드로 들어갈 수 있습니다.</small></form></dialog>
<section id="waiting" class="panel" hidden><p class="eyebrow" id="room-game"></p><h2 id="room-title"></h2><p id="room-state"></p><div id="players" class="players"></div><label for="invite">초대 링크</label><div class="row"><input id="invite" readonly><button id="copy" type="button">복사</button></div><p id="room-code"></p><div class="row"><button id="ready" class="primary">준비</button><button id="continue" hidden>경기로 돌아가기</button><button id="leave">방 나가기</button></div><p id="ready-hint">두 사람 모두 준비하면 게임이 시작됩니다.</p></section>
</div></div><footer><a href="index.html">← 게임 선택</a><span data-release>v1.8.2 · 로컬</span></footer>
</main><script src="config.js?v=1.8.2"></script><script src="rules.js?v=1.8.2"></script><script src="online.js?v=1.8.2"></script><script src="naval-client.js?v=1.8.2"></script><script src="characters.js?v=1.8.2"></script><script src="lobby.js?v=1.8.2"></script></body></html>
