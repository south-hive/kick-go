<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#182722"><title>온라인 로비 · 틈의 오락실</title><link rel="stylesheet" href="lobby.css?v=1.6.0"></head>
<body><main>
<header><a href="index.html">✧ 틈의 오락실</a><span>ONLINE LOUNGE</span></header>
<section class="intro"><p class="eyebrow">함께하는 한 판</p><h1>오늘의 상대를<br>만나보세요.</h1><p>알까기의 손끝 승부, 배틀십의 조용한 심리전.<br>방을 만들거나, 열려 있는 경기에 함께하세요.</p></section>
<p id="status" role="status" aria-live="polite">서버에 연결하고 있습니다. 처음 접속은 잠시 걸릴 수 있어요.</p>
<form id="identity" class="panel"><label for="nickname">내 닉네임</label><div class="row"><input id="nickname" maxlength="16" placeholder="별명 입력 (생략 가능)" autocomplete="nickname"><button id="save-name">저장</button></div><small>계정 없이 입장합니다. 같은 방의 중복 닉네임은 번호로 구분합니다.</small></form>
<section id="browse">
<div class="columns"><form id="create-form" class="panel"><h2>새로운 한 판</h2><label for="game">게임</label><select id="game"><option value="alkkagi">알까기 · 나무 위의 한 수</option><option value="naval">배틀십 · 깊은 바다의 한 수</option></select><label for="title">방 이름</label><input id="title" maxlength="32" placeholder="함께 한 판"><label for="visibility">공개 범위</label><select id="visibility"><option value="public">공개 · 로비 목록에 표시</option><option value="private">비공개 · 초대 링크와 코드로 입장</option></select><button id="create" class="primary">방 만들기 ↗</button></form>
<form id="join-form" class="panel"><h2>친구의 초대</h2><label for="join-game">초대받은 게임</label><select id="join-game"><option value="alkkagi">알까기</option><option value="naval">배틀십</option></select><label for="code">방 코드</label><input id="code" maxlength="12" placeholder="12자리 초대 코드" autocapitalize="characters" autocomplete="off" spellcheck="false"><div class="row"><button id="join" class="primary">참가하기</button><button id="watch-code" type="button">관전</button></div><small>비공개 방도 초대받은 코드로 들어갈 수 있습니다.</small></form></div>
<div class="list-heading"><h2>열려 있는 경기</h2><select id="filter" aria-label="방 목록 게임 필터"><option value="all">모든 게임</option><option value="alkkagi">알까기</option><option value="naval">배틀십</option></select></div><p id="directory-status" role="status">방 목록 연결 중…</p><div id="rooms" class="rooms"></div>
</section>
<section id="waiting" class="panel" hidden><p class="eyebrow" id="room-game"></p><h2 id="room-title"></h2><p id="room-state"></p><div id="players" class="players"></div><label for="invite">초대 링크</label><div class="row"><input id="invite" readonly><button id="copy" type="button">복사</button></div><p id="room-code"></p><div class="row"><button id="ready" class="primary">준비</button><button id="continue" hidden>경기로 돌아가기</button><button id="leave">방 나가기</button></div><p id="ready-hint">두 사람 모두 준비하면 게임이 시작됩니다.</p></section>
<footer><a href="index.html">← 게임 선택</a><span data-release>v1.6.0 · 로컬</span></footer>
</main><script src="config.js?v=1.6.0"></script><script src="online.js?v=1.6.0"></script><script src="naval-client.js?v=1.6.0"></script><script src="lobby.js?v=1.6.0"></script></body></html>
